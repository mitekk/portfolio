server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # One `add_header Cache-Control` per location, never `expires` as well: the two
  # together emit two conflicting Cache-Control headers.

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Serve the CV inline (open in browser) rather than forcing a download.
  location = /Mitya_Kurs.pdf {
    default_type application/pdf;
    add_header Content-Disposition "inline; filename=\"Mitya_Kurs.pdf\"";
    add_header Cache-Control "public, max-age=86400, must-revalidate";
  }

  # Social share cards + icons: long-lived but revalidated so refreshed art propagates.
  location ~* ^/(og-image|cv-og|cv-thumb|profile|apple-touch-icon|icon-192|icon-512|favicon-32|favicon)\.png$ {
    add_header Cache-Control "public, max-age=604800, must-revalidate";
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=604800, must-revalidate";
  }

  # /theBuzz is handled client-side by `<Navigate to="about">` in src/routes.tsx, so
  # react-snap never emits dist/theBuzz/index.html and the strict try_files below would
  # 404 it.
  location = /theBuzz {
    return 301 /theBuzz/about;
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
  }

  # Prerendered pages are served as file matches from inside this location, which is why
  # the header lives here rather than in a `location = /index.html` that they never hit.
  #
  # `=404` instead of a catch-all SPA fallback: an unknown path must answer 404, not 200
  # with the home page. The cost is that the route list in src/routes.tsx and the
  # `include` list in scripts/prerender.cjs have to stay in step — a route added to one
  # and not the other returns 404 in production.
  location / {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri $uri/index.html =404;
  }
}
